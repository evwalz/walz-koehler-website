hero:
  eyebrow: "KI & Data Science · Prognosen · Bildverarbeitung"
  heading: "KI-Modelle, die mit Ihren Daten funktionieren – und der Nachweis, dass sie es tun."
  lede: "Wir sind zwei Machine-Learning-Forschende und entwickeln individuelle Modelle für Unternehmen: Prognosen, mit denen Sie planen können, und Bilderkennung, die in Ihren Bildern findet, worauf es ankommt. Bevor etwas live geht, messen wir es an dem, was Sie heute schon nutzen."
  ctaPrimary: "Schreiben Sie uns"
  ctaSecondary: "Unsere Arbeiten ansehen"

services:
  heading: "Was wir tun"
  items:
    - title: "Prognosen"
      text: "Nachfrage, Energie, Absatz – alles, was sich mit der Zeit oder dem Wetter bewegt. Probabilistische Prognosen, die sagen, wie wahrscheinlich jedes Ergebnis ist, statt nur eine Zahl zu nennen – damit Sie für die ganze Bandbreite planen können."
    - title: "Bilderkennung & individuelle Modelle"
      text: "Bildmodelle, die erkennen, klassifizieren und segmentieren – für Qualitätsprüfung, Dokumente oder medizinische Bilder. Sprach-, multimodale und domänenspezifische Modelle, wenn die Aufgabe es verlangt."
    - title: "KI-Strategie & Machbarkeit"
      text: "Welche Ihrer Ideen lohnen sich? Wir bewerten Anwendungsfälle, Machbarkeit, Nutzen und die Einbindung in Ihre Systeme – bevor Sie investieren."
    - title: "Umsetzung & Befähigung"
      text: "Von Anfang bis Ende: Datenpipelines, Training, Evaluation, Deployment und MLOps. Und wir helfen Ihrem Team, KI sicher einzusetzen – damit alles auch nach uns weiterläuft."

range:
  heading: "Eine Bandbreite statt einer einzigen Zahl."
  body: "Jede Prognose ist unsicher. Wir zeigen, wie wahrscheinlich jedes Ergebnis ist – und je weiter wir vorausschauen, desto breiter wird die Spanne. Sie planen mit dem ganzen Bild statt mit falscher Genauigkeit."
  caption: "Beispieldaten zur Veranschaulichung."
  labels:
    observed: "beobachtet"
    today: "heute"
    forecast: "Prognose"
  ariaLabel: "Fächerdiagramm: beobachtete Werte bis heute, danach eine Prognose, deren Unsicherheitsbänder breiter und blasser werden, je weiter sie vorausschaut"

principle:
  heading: "Gemessen, nicht versprochen."
  body: "Viele KI-Projekte werden an einer Demo gemessen. Wir messen unsere an einem Vergleich: das neue Modell gegen Ihre bisherige Methode, auf Ihren Daten, mit einem fairen Maßstab, den wir vorher festlegen. Schlägt es Ihre Lösung nicht, sagen wir es Ihnen – bevor Sie in den Betrieb investieren. Saubere Evaluation ist für uns kein Zusatz. Sie ist Evas Forschungsgebiet."

work:
  heading: "Ausgewählte Arbeiten"
  items:
    - eyebrow: "Prognosen · gemeinsames Projekt · 2024"
      title: "Niederschlagsprognosen für das nördliche tropische Afrika"
      text: "Mit Kolleg:innen am KIT und am HITS haben wir ein Deep-Learning-Bildmodell mit einem statistischen Verfahren für Unsicherheit kombiniert, um den Niederschlag der nächsten 24 Stunden vorherzusagen. Es schlug das physikalische Ensemble des Europäischen Zentrums für mittelfristige Wettervorhersage (EZMW) – bei der Frage, ob es regnet, und bei der Frage, wie viel."
      link: "https://arxiv.org/abs/2401.03746"
      linkLabel: "Quelle"
      pending: false
    - eyebrow: "Bildverarbeitung · Gregor · DKFZ"
      title: "nnU-Net: medizinische Bildsegmentierung, die sich selbst konfiguriert"
      text: "Gregor ist Mitautor des ursprünglichen nnU-Net-Papers: ein Framework, das sich ohne manuelles Tuning an neue Segmentierungsaufgaben anpasst und in der medizinischen Bildverarbeitung zu einer weit verbreiteten Referenz geworden ist."
      link: "https://arxiv.org/abs/1809.10486"
      linkLabel: "Quelle"
      pending: false
    - eyebrow: "Evaluation · Eva · 2026"
      title: "Faire Vergleiche von KI- und physikalischen Wettermodellen"
      text: "Eva hat den Potential CRPS mitentwickelt – ein Maß, mit dem sich KI-Wettermodelle und klassische Modelle unter gleichen Bedingungen vergleichen lassen. Veröffentlicht in Artificial Intelligence for the Earth Systems."
      link: "https://journals.ametsoc.org/view/journals/aies/5/1/AIES-D-25-0054.1.xml"
      linkLabel: "Quelle"
      pending: false
    - eyebrow: "Kundenprojekt · seit 2025"
      title: "TODO: Projekttitel"
      text: "TODO: Zwei, drei Sätze: das Problem des Kunden, was wir gebaut haben, und das gemessene Ergebnis."
