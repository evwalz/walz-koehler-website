work:
  heading: "Ausgewählte Arbeiten"
  items:
    - eyebrow: "Bildsuche · Teileidentifikation"
      title: "Das richtige Teil per Foto finden"
      text: "Fotos werden mit dem Ersatzteilkatalog abgeglichen: aus einer manuellen Suche wurde eine automatische. Ein Foto findet das richtige Teil unter mehr als 15.000 Katalogprodukten, und zwar auch dann, wenn es im eingebauten Zustand aufgenommen wird: verdeckt von dem, was ringsherum montiert ist, und nur aus einer Richtung sichtbar. Jedes Katalogbild wird einmal in eine Vektordatenbank eingebettet, das Anfragefoto ist damit ein Punkt und die nächstgelegenen Punkte sind die Kandidaten; Teilenummern und Beschreibungen werden in derselben Anfrage durchsucht, beide Ranglisten zu einer verschmolzen. Das Ganze läuft produktiv hinter einer API, die auch Agenten nutzen: Sie labeln eingehende Fotos vor, ein Mensch prüft nach, und aus dem laufenden Betrieb wird der nächste Testdatensatz. Jedes Release wird gegen einen eingefrorenen, von Hand validierten Testdatensatz gemessen. Das macht aus „fühlt sich besser an“ eine Entscheidung."
      sources: []
      pending: false
      wide: true
      drawing: part-search
    - eyebrow: "Prognosen · 2024"
      title: "KI-Niederschlagsprognosen für das nördliche tropische Afrika"
      text: "Schlug das physikalische EZMW-Ensemble bei 24-Stunden-Niederschlag."
      sources:
        - href: "https://arxiv.org/abs/2401.03746"
          label: "Quelle"
      pending: false
    - eyebrow: "Bildverarbeitung · Mitautor am DKFZ"
      title: "nnU-Net: Segmentierung, die sich selbst konfiguriert"
      text: "Es stellt sich auf jeden neuen medizinischen Bilddatensatz selbst ein und wurde so zur Referenz."
      sources:
        - href: "https://arxiv.org/abs/1809.10486"
          label: "Quelle"
      pending: false
    - eyebrow: "Bildverarbeitung · Erstautor, WACV 2024"
      title: "RecycleNet: ein Netz, das seine eigene Antwort überdenkt"
      text: "Statt in einem einzigen Durchgang zu entscheiden, gibt das Modell seine eigenen Merkmale in frühere Schichten zurück und verfeinert die Entscheidung über mehrere Runden hinweg, über mehr Runden, als es im Training je gesehen hat. Es tauscht Rechenzeit gegen Genauigkeit, und dieser Tausch lohnt sich überall dort, wo eine falsche Antwort teuer ist."
      sources:
        - href: "https://arxiv.org/abs/2309.07513"
          label: "Quelle"
      pending: false
    - eyebrow: "Dokumentenverständnis · Auftragseingang"
      title: "Bestellungen dort gelesen, wo sie ankommen"
      text: "Bestell-PDFs werden zu validiertem, angereichertem JSON mit Konfidenz je Feld, abgeglichen mit Kunden- und Ersatzteilkatalog und bereit für das ERP. Das Modell läuft auf der Maschine im Haus, und kein Dokument verlässt sie."
      sources: []
      pending: false
    - eyebrow: "Evaluation"
      title: "Die passende Metrik für die Aufgabe wählen"
      text: "Eine Metrik sagt mehr, wenn sie zum Ziel passt, und wenn man weiß, wie sie zu lesen ist."
      sources:
        - href: "https://arxiv.org/abs/2510.17994"
          label: "Quelle"
      pending: false
    - eyebrow: "Edge-ML · Beratung"
      title: "Arten erkennen auf einem solarbetriebenen Sensor"
      text: "Beratung von Hula Earth, einem Münchner Startup für Biodiversitätsmonitoring, zum Modell in seinem Feldgerät: ein kleines Netz, quantisiert auf einen Mikrocontroller, angelernt von einem sehr viel größeren und mit unbeschrifteten Aufnahmen weitergetrieben."
      sources: []
      pending: false
    - eyebrow: "Unsicherheit"
      title: "Wie sicher eine Vorhersage ist"
      text: "Nicht nur die Antwort, sondern auch, wie sehr Sie sich darauf verlassen können."
      sources:
        - href: "https://arxiv.org/abs/2212.08376"
          label: "Quelle"
      pending: false

