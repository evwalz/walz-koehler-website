howWeWork:
  heading: "So arbeiten wir"
  steps:
    - title: "Sie schreiben uns"
      text: "Beschreiben Sie, was Sie vorhersagen oder erkennen möchten und welche Daten Sie haben. Ein paar Sätze reichen."
    - title: "Wir prüfen die Machbarkeit"
      text: "Wir sehen uns Aufgabe und Daten an und sagen Ihnen ehrlich, ob sich KI lohnt – und wie ein fairer Test aussähe."
    - title: "Wir bauen, messen, übergeben"
      text: "Das Modell, sein Vergleich mit Ihrer bisherigen Methode, die Inbetriebnahme – und ein Team, das es weiterführen kann."

about:
  heading: "Wer wir sind"
  photoPlaceholder: "TODO: Foto"
  people:
    - name: "Dr. Eva-Maria Walz"
      role: "Prognosen & Evaluation"
      bio: "Statistikerin mit Schwerpunkt auf probabilistischen Prognosen – und auf der Frage, woran man erkennt, ob eine Prognose wirklich gut ist. Forschung am Karlsruher Institut für Technologie (KIT) und am Heidelberger Institut für Theoretische Studien (HITS), mit Veröffentlichungen zu Wettervorhersage, Prognosebewertung und maschinellem Lernen. Sie entwickelt außerdem Software bis in den produktiven Betrieb."
      photo: "eva-walz.jpg"
      photoAlt: "Porträt von Dr. Eva-Maria Walz"
    - name: "Gregor Köhler"
      role: "Bildverarbeitung & individuelle KI-Modelle"
      bio: "Seit 2015 im Machine Learning. Acht Jahre Deep-Learning-Forschung am Deutschen Krebsforschungszentrum (DKFZ), Mitautor von nnU-Net und seit 2025 selbstständiger KI-Berater. Mitorganisator des Freiburg.AI-Meetups und zuvor von heidelberg.ai (über 3.000 Mitglieder)."
      photo: "gregor-koehler.jpg"
      photoAlt: "Porträt von Gregor Köhler"

