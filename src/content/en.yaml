howWeWork:
  heading: "How we work"
  steps:
    - title: "You write to us"
      text: "Tell us what you want to predict or recognise, and what data you have. A few sentences are enough."
    - title: "We check feasibility"
      text: "We look at the problem and the data and tell you honestly whether AI will pay off, and what a fair test would look like."
    - title: "We build, measure, hand over"
      text: "The model, its comparison against your current method, deployment, and a team that can run it."

about:
  heading: "Who we are"
  photoPlaceholder: "TODO: photo"
  people:
    - name: "Dr. Eva-Maria Walz"
      role: "Forecasting & evaluation"
      bio: "Statistician working on probabilistic forecasting and on how to tell whether a forecast is actually good. Research at the Karlsruhe Institute of Technology (KIT) and the Heidelberg Institute for Theoretical Studies (HITS), with publications on weather prediction, forecast evaluation and machine learning. She also builds and ships production software."
      photo: "eva-walz.jpg"
      photoAlt: "Portrait of Dr. Eva-Maria Walz"
    - name: "Gregor Köhler"
      role: "Computer vision & custom AI models"
      bio: "Machine-learning practitioner since 2015. Eight years of deep-learning research at the German Cancer Research Center (DKFZ), co-author of nnU-Net, and independent AI consultant since 2025. Co-organizes the Freiburg.AI meetup and co-organized heidelberg.ai (3,000+ members)."
      photo: "gregor-koehler.jpg"
      photoAlt: "Portrait of Gregor Köhler"

