work:
  heading: "Selected work"
  items:
    - eyebrow: "Image search · parts identification"
      title: "The right part, found from a photo"
      text: "Photos matched against the parts catalogue: a manual lookup became an automatic one. Every catalogue image is embedded once into a vector database, so a query photo is a point and the nearest points are the candidates; part numbers and descriptions are searched in the same request, and the two rankings are fused into one. It runs in production behind an API that agents can call too — they pre-label incoming photos, a human checks them, and everyday traffic becomes the next test set. Every release is scored against a frozen, human-validated test set, which is what turns “this feels better” into a decision."
      sources: []
      pending: false
      wide: true
      drawing: part-search
    - eyebrow: "Forecasting · 2024"
      title: "AI forecasts of rainfall for northern tropical Africa"
      text: "Beat the ECMWF physics ensemble on 24-hour rainfall."
      sources:
        - href: "https://arxiv.org/abs/2401.03746"
          label: "Source"
      pending: false
    - eyebrow: "Computer vision · co-authored at DKFZ"
      title: "nnU-Net: segmentation that configures itself"
      text: "It adapts its own setup to each new medical imaging dataset, which made it a standard baseline."
      sources:
        - href: "https://arxiv.org/abs/1809.10486"
          label: "Source"
      pending: false
    - eyebrow: "Document understanding · order intake"
      title: "Orders read where they arrive"
      text: "Ordering PDFs turned into validated, enriched JSON with a confidence score per field, matched against the customer and parts catalogues and ready for the ERP. The model runs on the machine in the building — no document leaves it."
      sources: []
      pending: false
    - eyebrow: "Evaluation"
      title: "Choosing the right score for the task"
      text: "A score says more when it fits the goal — and when you know how to read it."
      sources:
        - href: "https://arxiv.org/abs/2510.17994"
          label: "Source"
      pending: false
    - eyebrow: "Edge ML · advisory"
      title: "Species recognised on a solar-powered sensor"
      text: "Advising a biodiversity-monitoring startup on the model inside its field device: a small network quantised onto a microcontroller, taught by a far larger one and pushed further with unlabelled recordings."
      sources: []
      pending: false
    - eyebrow: "Uncertainty"
      title: "How certain a prediction is"
      text: "Not just the answer — how much you can rely on it."
      sources:
        - href: "https://arxiv.org/abs/2212.08376"
          label: "Source"
      pending: false
    - eyebrow: "Simulation · our own lab"
      title: "User research before there are users"
      text: "Draw a population from a known feature distribution, then let a model answer as each of those people would. Feedback on a questionnaire or a product while both are still being built — checked against distributions we can verify."
      sources: []
      pending: false
    - eyebrow: "Research · ongoing"
      title: "Learning from few labels"
      text: "Self-supervised pretraining and semi-supervised learning that cut how many annotated scans a segmentation model needs — measured honestly against a well-tuned nnU-Net baseline."
      sources: []
      pending: false

