hero:
  eyebrow: "AI & data science · forecasting · computer vision"
  heading: "AI models that work on your data — and proof that they do."
  lede: "We are two machine-learning researchers who build custom models for companies: forecasts you can plan with, and vision systems that find what matters in your images. Before anything goes live, we measure it against what you use today."
  ctaPrimary: "Write to us"
  ctaSecondary: "See our work"

services:
  heading: "What we do"
  items:
    - title: "Forecasting"
      text: "Demand, energy, sales — anything that moves with time or weather. Probabilistic forecasts that say how likely each outcome is, not just one number, so you can plan for the whole range."
    - title: "Image recognition & custom models"
      text: "Vision models that detect, classify and segment, for inspection, documents or medical images. Language, multimodal and domain-specific models when the problem calls for them."
    - title: "AI strategy & feasibility"
      text: "Which of your ideas are worth building? We evaluate use cases, feasibility, return and how a model fits your systems — before you invest."
    - title: "Implementation & enablement"
      text: "End to end: data pipelines, training, evaluation, deployment and MLOps. And we help your team adopt AI safely, so it keeps working after we leave."

range:
  heading: "A range, not a single number."
  body: "Every forecast is uncertain. We show how likely each outcome is — and the further ahead we look, the wider the range gets. You plan with the whole picture, not with false precision."
  caption: "Example data, for illustration."
  labels:
    observed: "observed"
    today: "today"
    forecast: "forecast"
  ariaLabel: "Fan chart: observed values up to today, then a forecast whose uncertainty bands widen and fade the further ahead it looks"

principle:
  heading: "Measured, not promised."
  body: "Many AI projects are judged by a demo. We judge ours by a comparison: the new model against your current method, on your data, with a fair score agreed up front. If it does not beat what you have, we tell you — before you invest in running it. Rigorous evaluation is not an add-on for us. It is Eva’s research field."

work:
  heading: "Selected work"
  items:
    - eyebrow: "Forecasting · joint project · 2024"
      title: "Rainfall forecasts for northern tropical Africa"
      text: "With colleagues at KIT and HITS, we combined a deep-learning image model with a statistical method for uncertainty to forecast 24-hour rainfall. It beat the physics-based ensemble of the European Centre for Medium-Range Weather Forecasts (ECMWF), both on whether it rains and on how much."
      link: "https://arxiv.org/abs/2401.03746"
      linkLabel: "Source"
      pending: false
    - eyebrow: "Computer vision · Gregor · DKFZ"
      title: "nnU-Net: medical image segmentation that configures itself"
      text: "Gregor is a co-author of the original nnU-Net paper: a framework that adapts itself to a new segmentation task without manual tuning, and has become a widely used baseline in medical imaging."
      link: "https://arxiv.org/abs/1809.10486"
      linkLabel: "Source"
      pending: false
    - eyebrow: "Evaluation · Eva · 2026"
      title: "Fair comparisons of AI and physics-based weather models"
      text: "Eva co-developed the potential CRPS, a measure that lets AI weather models and classical ones be compared on equal terms. Published in Artificial Intelligence for the Earth Systems."
      link: "https://journals.ametsoc.org/view/journals/aies/5/1/AIES-D-25-0054.1.xml"
      linkLabel: "Source"
      pending: false
    - eyebrow: "Client project · since 2025"
      title: "TODO: Project title"
      text: "TODO: Two or three sentences: the client's problem, what we built, and the measured result."
      link: null
      linkLabel: "Source"
